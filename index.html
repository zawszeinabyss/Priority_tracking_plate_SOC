<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1d">
<title>Truck Check V06</title>

<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: #080d1d;
    color: #eef4ff;
    font-family: system-ui, -apple-system, sans-serif;
  }

  main {
    max-width: 560px;
    padding: 22px 16px;
    margin: auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    color: #80cfff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  h1 { margin: 8px 0 0; font-size: 30px; }

  .badge {
    padding: 8px 12px;
    background: #142139;
    color: #a9d9ff;
    border-radius: 20px;
    font-size: 12px;
  }

  .viewer {
    position: relative;
    min-height: 160px;
    overflow: hidden;
    background: #000;
    border-radius: 18px;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
  }

  #guide {
    position: absolute;
    outline: 2px solid #80cfff;
    border-radius: 10px;
    box-shadow: 0 0 0 1000px #0006;
    pointer-events: none;
  }

  #guide span {
    position: absolute;
    bottom: -25px;
    width: 100%;
    font-size: 10px;
    text-align: center;
  }

  .card {
    margin-top: 18px;
    padding: 20px 16px;
    background: #111b30;
    border: 1px solid #344661;
    border-radius: 18px;
  }

  #result { text-align: center; }

  #result.priority {
    background: #112b22;
    border-color: #65c879;
  }

  #result.regular {
    background: #352219;
    border-color: #e4a678;
  }

  #plate {
    margin: 0;
    font-size: clamp(24px, 7vw, 36px);
    overflow-wrap: anywhere;
  }

  #resultText {
    font-size: 18px;
    color: #c4d1e3;
    line-height: 1.6;
    margin-bottom: 0;
  }

  label {
    display: block;
    margin: 12px 0 8px;
    font-weight: 600;
    font-size: 14px;
  }

  input, button {
    font: inherit;
    font-size: 16px;
    border-radius: 10px;
    padding: 13px 11px;
  }

  input {
    width: 100%;
    min-width: 0;
    color: white;
    background: #080d1d;
    border: 1px solid #344661;
  }

  input:focus {
    outline: 2px solid #3489c7;
  }

  button {
    border: 0;
    color: white;
    background: #3489c7;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled { opacity: .5; cursor: wait; }

  #manualForm {
    display: flex;
    gap: 8px;
  }

  #manualInput { flex: 1; text-transform: uppercase; }

  #connectButton, #retryCamera {
    width: 100%;
    margin-top: 12px;
  }

  summary { cursor: pointer; font-weight: 700; }

  .note, #sourceStatus, #connectionMessage, footer {
    font-size: 12px;
    color: #a5b6ce;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  #connectionMessage {
    white-space: pre-line;
    color: #ffd39a;
  }

  #sourceStatus, footer { text-align: center; }

  footer { margin-top: 18px; }
  #loginMessage {white-space:pre-line;line-height:1.6;color:#c4d1e3}
  #loginLink {display:block;margin:16px 0;color:#80cfff}
  #accountBar {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  #accountEmail {font-size:13px;overflow-wrap:anywhere}
  #logoutButton {font-size:13px;padding:10px}
  #loginButton,#checkLogin {width:100%;margin:8px 0}
</style>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
</head>

<body>
<main>
  <header>
    <div>
      <div class="brand">BD MEGA · TRUCK CHECK</div>
      <h1>Quét BKS</h1>
    </div>
    <span class="badge">V06</span>
  </header>

  <section id="loginGate" class="card">
    <h2>Đăng nhập để quét BKS</h2>
    <p class="note">Dùng tài khoản Google đã được admin thêm vào Users.</p>
    <button id="loginButton" type="button">Đăng nhập Google</button>
    <p id="loginMessage" role="status"></p>
    <a id="loginLink" target="_blank" rel="noopener noreferrer" hidden>Mở trang cấp quyền Google</a>
    <button id="checkLogin" type="button" hidden>Tôi đã xác nhận · Kiểm tra lại</button>
  </section>
  <section id="accountBar" class="card" hidden>
    <span id="accountEmail"></span>
    <button id="logoutButton" type="button">Đăng xuất</button>
  </section>
  <div id="scannerContent" hidden>
  <section class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <div id="guide" hidden>
      <span>ĐƯA BKS VÀO GIỮA KHUNG</span>
    </div>
  </section>

  <button id="retryCamera" type="button" hidden>
    Chạm để mở lại camera
  </button>

  <section id="result" class="card"
           aria-live="polite" aria-atomic="true">
    <h2 id="plate">Đang chuẩn bị…</h2>
    <p id="resultText">Đang khởi động camera.</p>
  </section>

  <section class="card">
    <label for="manualInput">Nhập biển số dự phòng</label>
    <form id="manualForm">
      <input id="manualInput"
             placeholder="VD: 50E-504.74"
             maxlength="30"
             autocomplete="off"
             autocapitalize="characters"
             spellcheck="false"
             required>
      <button type="submit">Kiểm tra</button>
    </form>
  </section>

  <p id="sourceStatus" role="status">Đang tải danh sách UT…</p>
  <details id="adminPanel" class="card" hidden><summary>Chẩn đoán · Admin</summary>
    <p id="adminStatus" class="note"></p>
  </details>
  </div>
  <footer>Truck Check V06 · Chưa ghi log lượt quét</footer>

  <canvas id="modelCanvas" width="128" height="64" hidden></canvas>
</main>

<script>
(() => {
  'use strict';

  // URL công khai của deployment API V06. Không đặt secret trong HTML.
  const UT_API_URL = 'https://script.google.com/macros/s/AKfycby_ljyTi44AEj4uOYoQ690bSkw2gzAePiXwJL-9brYAMMgcmIUp7ilSJiD7NOQPOzVrMA/exec';
  const LOGIN_URL = 'https://script.google.com/macros/s/AKfycbz5CqGC2pso4pttjPk72Q3WRRg9LDy3bGrjBrpEUXmfZ1ckFZMsQIFnE-3dpUl_4a77Pw/exec';

  const CFG = Object.freeze({
    modelUrl: new URL('./cct_xs_v2_global.onnx', location.href).href,
    runtimePath:
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
    alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_',
    scanMs: 300,
    stableRequired: 2,
    minMean: 0.70,
    minChar: 0.40,
    refreshMs: 30000,
    maxSourceAgeMs: 120000,
    ocrHoldMs: 1800,
    manualHoldMs: 5000
  });

  const $ = id => document.getElementById(id);
  const video = $('video');
  const canvas = $('modelCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const AUTH_STORAGE = 'truck_check_login_v06';
  const PENDING_STORAGE = 'truck_check_pending_v06';
  const auth = {token:'',user:null,expiresAt:0,verifiedAt:0,epoch:0,pending:null,pollTimer:null,polling:false};
  const ut = {snapshot:null,loading:false,timer:null,error:''};
  const cam = {
    session: null,
    modelPromise: null,
    stream: null,
    starting: false,
    running: false,
    busy: false,
    generation: 0,
    timer: null,
    lastFrame: -1,
    candidate: '',
    hits: 0,
    candidateAt: 0
  };

  let selectedPlate = '';
  let selectedUntil = 0;
  let manualUntil = 0;

  function normalize(value) {
    return String(value || '')
      .toUpperCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '');
  }

  function plausible(plate) {
    return /^\d{2}[A-Z]{1,2}\d{4,5}$/.test(plate);
  }

  function render(plate, message, kind = '') {
    $('result').className = 'card' + (kind ? ' ' + kind : '');
    if ($('plate').textContent !== plate) $('plate').textContent = plate;
    if ($('resultText').textContent !== message) {
      $('resultText').textContent = message;
    }
  }

  function sourceReady() {
    return allowed() && !!ut.snapshot &&
      Date.now() - ut.snapshot.downloadedAt <= CFG.maxSourceAgeMs;
  }

  function lookup(plate) {
    if (!sourceReady()) {
      render(plate, 'Chưa có dữ liệu UT khả dụng.');
      return;
    }

    const priority = ut.snapshot.plates.has(plate);
    render(
      plate,
      priority ? 'Ưu tiên' : 'Không ưu tiên',
      priority ? 'priority' : 'regular'
    );
  }

  function refreshResult() {
    if (!selectedPlate) return;

    if (performance.now() < selectedUntil) {
      lookup(selectedPlate);
    } else {
      selectedPlate = '';
      if (cam.running) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }
    }
  }

  function allowed() {
    return !!auth.token && !!auth.user && Date.now() < auth.expiresAt &&
      Date.now() - auth.verifiedAt < 90000;
  }

  function sourceStatus() {
    $('sourceStatus').textContent = ut.error || (sourceReady()
      ? 'Danh sách UT đã kết nối.' : 'Đang tải danh sách UT…');
    if (auth.user?.role === 'ADMIN') {
      $('adminStatus').textContent = (ut.snapshot?.plates.size || 0) +
        ' BKS · API V06 · Quyền được kiểm tra lại khi tải nguồn mỗi 30 giây. ' +
        'Thời điểm tải không phải thời điểm IMPORTRANGE làm mới.';
    }
  }

  function saveSession() {
    try { sessionStorage.setItem(AUTH_STORAGE, JSON.stringify({
      token:auth.token, expiresAt:auth.expiresAt
    })); } catch (_) {}
  }

  function clearPending() {
    clearTimeout(auth.pollTimer);
    auth.pending = null;
    try { sessionStorage.removeItem(PENDING_STORAGE); } catch (_) {}
    $('loginLink').hidden = true;
    $('loginLink').removeAttribute('href');
    $('checkLogin').hidden = true;
  }

  function closeSession(message = 'Vui lòng đăng nhập để tiếp tục.') {
    auth.epoch++;
    auth.token = ''; auth.user = null; auth.expiresAt = 0; auth.verifiedAt = 0;
    ut.snapshot = null; ut.error = '';
    clearTimeout(ut.timer); clearPending(); stopCamera();
    selectedPlate = ''; selectedUntil = 0; manualUntil = 0;
    $('manualInput').value = '';
    $('scannerContent').hidden = true;
    $('accountBar').hidden = true;
    $('adminPanel').hidden = true;
    $('accountEmail').textContent = '';
    $('loginGate').hidden = false;
    $('loginButton').disabled = false;
    $('loginButton').textContent = 'Đăng nhập Google';
    $('loginMessage').textContent = message;
    try { sessionStorage.removeItem(AUTH_STORAGE); } catch (_) {}
  }

  async function apiCall(body) {
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(UT_API_URL)) {
      throw new Error('Admin cần điền UT_API_URL đúng trong index.html.');
    }
    const control = new AbortController();
    const timer = setTimeout(() => control.abort(), 25000);
    try {
      const response = await fetch(UT_API_URL, {
        method:'POST', redirect:'follow', credentials:'omit',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body:JSON.stringify(body), signal:control.signal
      });
      if (!response.ok) throw new Error('API HTTP ' + response.status + '. Kiểm tra URL /exec và deployment API V06.');
      let result;
      try { result = await response.json(); }
      catch (_) { throw new Error('API trả HTML. Kiểm tra deployment API: Execute as Me, access Anyone.'); }
      if (!result || result.ok !== true) {
        const err = new Error(result?.message || 'API trả kết quả không hợp lệ.');
        err.code = result?.code; throw err;
      }
      return result;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('Kết nối quá 25 giây. Hãy kiểm tra mạng rồi thử lại.');
      if (err.message === 'Failed to fetch') throw new Error('Không đọc được API. Kiểm tra mạng, URL và quyền deployment.');
      throw err;
    } finally { clearTimeout(timer); }
  }

  function randomHex() {
    return Array.from(crypto.getRandomValues(new Uint8Array(32)), x => x.toString(16).padStart(2,'0')).join('');
  }
  async function sha256(text) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(digest), x => x.toString(16).padStart(2,'0')).join('');
  }
  function showPending() {
    const p = auth.pending;
    if (!p) return;
    $('loginMessage').textContent = 'Mã đối chiếu: ' + p.challenge.slice(0,8).toUpperCase() +
      '\nMở trang Google, xác nhận đúng mã và email, rồi quay lại tab này.';
    $('loginLink').href = LOGIN_URL + '?challenge=' + p.challenge;
    $('loginLink').hidden = false;
    $('checkLogin').hidden = false;
    $('loginButton').textContent = 'Bắt đầu đăng nhập lại';
  }

  $('loginButton').addEventListener('click', async () => {
    // Open during the user's gesture so Safari can open a separate tab.
    const popup = window.open('about:blank','_blank');
    if (popup) popup.opener = null;
    closeSession('Đang chuẩn bị đăng nhập…');
    const epoch = auth.epoch;
    $('loginButton').disabled = true;
    try {
      const verifier = randomHex();
      const challenge = await sha256(verifier);
      const r = await apiCall({action:'begin', challenge});
      if (epoch !== auth.epoch) { if(popup) popup.close(); return; }
      auth.pending = {verifier, challenge, expiresAt:r.expiresAt};
      try { sessionStorage.setItem(PENDING_STORAGE, JSON.stringify(auth.pending)); } catch (_) {}
      showPending();
      if (popup) popup.location.replace(LOGIN_URL + '?challenge=' + challenge);
      schedulePoll();
    } catch (err) {
      if (popup) popup.close();
      if (epoch === auth.epoch) $('loginMessage').textContent = err.message;
    } finally { if (epoch === auth.epoch) $('loginButton').disabled = false; }
  });

  function schedulePoll() {
    clearTimeout(auth.pollTimer);
    if (auth.pending && !document.hidden) auth.pollTimer = setTimeout(pollLogin, 4000);
  }

  async function pollLogin() {
    const p = auth.pending;
    if (!p || auth.polling || document.hidden) return;
    if (Date.now() >= p.expiresAt) { closeSession('Lượt đăng nhập hết hạn. Bấm Đăng nhập Google để thử lại.'); return; }
    const epoch = auth.epoch;
    auth.polling = true;
    $('checkLogin').disabled = true;
    try {
      const r = await apiCall({action:'exchange',verifier:p.verifier});
      if (epoch !== auth.epoch || auth.pending !== p) return;
      if (r.status === 'PENDING') return;
      if (r.status !== 'AUTHORIZED' || !/^[A-Za-z0-9_-]{43}$/.test(r.sessionToken || '') ||
          !Number.isFinite(r.expiresAt)) throw new Error('Phản hồi đăng nhập không hợp lệ.');
      auth.token = r.sessionToken; auth.expiresAt = r.expiresAt;
      clearPending(); saveSession();
      $('loginMessage').textContent = 'Đã đăng nhập. Đang tải danh sách UT…';
      await loadSource();
    } catch (err) {
      if (epoch !== auth.epoch) return;
      if (['FORBIDDEN','LOGIN_EXPIRED','UNAUTHORIZED'].includes(err.code)) closeSession(err.message);
      else $('loginMessage').textContent = err.message + '\nBạn có thể bấm Kiểm tra lại.';
    } finally {
      auth.polling = false;
      $('checkLogin').disabled = false;
      schedulePoll();
    }
  }

  $('checkLogin').addEventListener('click', pollLogin);
  $('logoutButton').addEventListener('click', () => {
    const token = auth.token;
    closeSession('Bạn đã đăng xuất.');
    if (token) void apiCall({action:'logout',sessionToken:token}).catch(() => {});
  });

  function scheduleSource() {
    clearTimeout(ut.timer);
    if (auth.token && !document.hidden) ut.timer = setTimeout(loadSource, CFG.refreshMs);
  }

  async function loadSource() {
    if (ut.loading || !auth.token || document.hidden) return;
    ut.loading = true;
    const epoch = auth.epoch;
    clearTimeout(ut.timer);
    try {
      const r = await apiCall({action:'source',sessionToken:auth.token});
      if (epoch !== auth.epoch) return;
      if (!r.user || !['ADMIN','SCANNER'].includes(r.user.role) ||
          typeof r.user.email !== 'string' || !r.user.email ||
          !Number.isFinite(r.user.expiresAt) || r.user.expiresAt <= Date.now() ||
          r.sourceType !== 'CURRENT_UT_LIST' || !Array.isArray(r.plates) || !r.plates.length ||
          r.plates.some(p => typeof p !== 'string' || p !== normalize(p) || !/[A-Z]/.test(p) || !/[0-9]/.test(p))) {
        throw new Error('API trả dữ liệu không đúng cấu trúc V06.');
      }
      const plates = new Set(r.plates);
      if (plates.size !== r.count || plates.size !== r.plates.length) throw new Error('Số lượng BKS UT không khớp.');
      auth.user = r.user; auth.expiresAt = r.user.expiresAt; auth.verifiedAt = Date.now();
      ut.snapshot = {plates,downloadedAt:Date.now()}; ut.error = '';
      $('loginGate').hidden = true;
      $('scannerContent').hidden = false;
      $('accountBar').hidden = false;
      $('accountEmail').textContent = auth.user.email;
      $('adminPanel').hidden = auth.user.role !== 'ADMIN';
      saveSession();
      void startCamera();
    } catch (err) {
      if (epoch !== auth.epoch) return;
      if (['UNAUTHORIZED','FORBIDDEN'].includes(err.code)) closeSession(err.message);
      else {
        ut.error = err.message;
        $('loginMessage').textContent = err.message + '\nĐang thử tải lại…';
      }
    } finally {
      ut.loading = false;
      sourceStatus(); refreshResult(); scheduleSource();
    }
  }

  $('manualForm').addEventListener('submit', event => {
    event.preventDefault();

    if (!allowed()) return;
    const plate = normalize($('manualInput').value);
    manualUntil = performance.now() + CFG.manualHoldMs;
    cam.candidate = '';
    cam.hits = 0;

    if (!plausible(plate)) {
      selectedPlate = '';
      render('Kiểm tra lại BKS', 'Ví dụ: 50E-504.74 hoặc 50E50474.');
      return;
    }

    selectedPlate = plate;
    selectedUntil = manualUntil;
    lookup(plate);

    $('manualInput').value = plate;
    $('manualInput').blur();
  });

  // ===================== ONNX =====================

  async function loadModel() {
    if (cam.session) return cam.session;
    if (cam.modelPromise) return cam.modelPromise;

    cam.modelPromise = (async () => {
      if (!window.ort) {
        throw new Error('Không tải được thư viện OCR. Hãy tải lại trang.');
      }

      ort.env.wasm.wasmPaths = CFG.runtimePath;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      let bytes;

      try {
        const response = await fetch(CFG.modelUrl, {
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('Tải model lỗi HTTP ' + response.status);
        }

        bytes = await response.arrayBuffer();
      } finally {
        clearTimeout(timeout);
      }

      const session = await ort.InferenceSession.create(bytes, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all'
      });

      if (!session.outputNames.includes('plate')) {
        await session.release();
        throw new Error('Model không có đầu ra plate.');
      }

      cam.session = session;
      return session;
    })();

    try {
      return await cam.modelPromise;
    } finally {
      cam.modelPromise = null;
    }
  }

  function getRoi() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    let width = vw * 0.86;
    let height = width / 2;

    if (height > vh * 0.48) {
      height = vh * 0.48;
      width = height * 2;
    }

    return {
      x: (vw - width) / 2,
      y: (vh - height) / 2,
      width,
      height
    };
  }

  function updateGuide() {
    if (!video.videoWidth || !video.videoHeight) return;

    const roi = getRoi();
    const guide = $('guide');

    guide.style.left = roi.x / video.videoWidth * 100 + '%';
    guide.style.top = roi.y / video.videoHeight * 100 + '%';
    guide.style.width = roi.width / video.videoWidth * 100 + '%';
    guide.style.height = roi.height / video.videoHeight * 100 + '%';
    guide.hidden = false;
  }

  function makeTensor() {
    const roi = getRoi();

    ctx.drawImage(
      video,
      roi.x, roi.y, roi.width, roi.height,
      0, 0, 128, 64
    );

    const rgba = ctx.getImageData(0, 0, 128, 64).data;
    const rgb = new Uint8Array(128 * 64 * 3);

    for (let i = 0, j = 0; i < rgba.length; i += 4) {
      rgb[j++] = rgba[i];
      rgb[j++] = rgba[i + 1];
      rgb[j++] = rgba[i + 2];
    }

    return new ort.Tensor('uint8', rgb, [1, 64, 128, 3]);
  }

  function decode(output) {
    if (
      !output || output.dims.length !== 3 ||
      output.dims[0] !== 1 ||
      output.dims[1] !== 10 ||
      output.dims[2] !== 37
    ) {
      throw new Error('Đầu ra OCR không đúng cấu hình.');
    }

    let plate = '';
    let total = 0;
    let minimum = 1;
    let count = 0;

    for (let slot = 0; slot < 10; slot++) {
      const offset = slot * 37;
      let best = 0;
      let maximum = -Infinity;
      let lowest = Infinity;
      let sum = 0;

      for (let j = 0; j < 37; j++) {
        const value = Number(output.data[offset + j]);
        if (!Number.isFinite(value)) throw new Error('Điểm OCR không hợp lệ.');

        sum += value;
        lowest = Math.min(lowest, value);

        if (value > maximum) {
          maximum = value;
          best = j;
        }
      }

      let confidence = maximum;

      if (!(lowest >= 0 && maximum <= 1 && Math.abs(sum - 1) < 0.08)) {
        let denominator = 0;

        for (let j = 0; j < 37; j++) {
          denominator += Math.exp(output.data[offset + j] - maximum);
        }

        confidence = 1 / denominator;
      }

      const character = CFG.alphabet[best];

      if (character !== '_') {
        plate += character;
        total += confidence;
        minimum = Math.min(minimum, confidence);
        count++;
      }
    }

    return {
      plate,
      mean: count ? total / count : 0,
      minimum: count ? minimum : 0
    };
  }

  function acceptOcr(result) {
    const now = performance.now();

    if (document.activeElement === $('manualInput') || now < manualUntil) {
      cam.candidate = '';
      cam.hits = 0;
      return;
    }

    const good = plausible(result.plate) &&
      result.mean >= CFG.minMean &&
      result.minimum >= CFG.minChar;

    if (good) {
      const same = result.plate === cam.candidate &&
        now - cam.candidateAt <= 2000;

      cam.hits = same ? cam.hits + 1 : 1;
      cam.candidate = result.plate;
      cam.candidateAt = now;

      if (cam.hits >= CFG.stableRequired) {
        selectedPlate = result.plate;
        selectedUntil = now + CFG.ocrHoldMs;
        lookup(selectedPlate);
        return;
      }
    } else {
      cam.candidate = '';
      cam.hits = 0;
    }

    if (now >= selectedUntil) {
      selectedPlate = '';
      render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
    }
  }

  // ===================== CAMERA =====================

  function stopCamera() {
    cam.generation++;
    clearTimeout(cam.timer);
    cam.running = false;
    cam.starting = false;
    cam.candidate = '';
    cam.hits = 0;
    cam.lastFrame = -1;

    if (cam.stream) {
      cam.stream.getTracks().forEach(track => track.stop());
      cam.stream = null;
    }

    video.pause();
    video.srcObject = null;
    $('guide').hidden = true;
  }

  function cameraError(error) {
    stopCamera();

    const messages = {
      NotAllowedError: 'Cần cho phép truy cập camera.',
      NotFoundError: 'Không tìm thấy camera.',
      NotReadableError: 'Camera đang bận hoặc không đọc được.',
      AbortError: 'Tải OCR quá lâu. Kiểm tra mạng.'
    };

    $('retryCamera').hidden = false;
    $('retryCamera').disabled = false;
    $('retryCamera').textContent =
      (messages[error.name] || error.message) + ' · Thử lại';

    if (!selectedPlate) {
      render('Camera chưa sẵn sàng', 'Bạn vẫn có thể nhập BKS bên dưới.');
    }
  }

  async function startCamera() {
    if (!allowed() || cam.starting || cam.running || document.hidden) return;

    const token = ++cam.generation;
    cam.starting = true;
    $('retryCamera').hidden = true;
    $('retryCamera').disabled = true;

    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('Mở trang HTTPS bằng Safari hoặc Chrome.');
      }

      const modelTask = loadModel().then(
        value => ({ value }),
        error => ({ error })
      );

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      if (token !== cam.generation || document.hidden) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }

      cam.stream = stream;
      video.srcObject = stream;

      stream.getVideoTracks()[0].addEventListener('ended', () => {
        if (token === cam.generation) cameraError(new Error('Camera đã ngắt.'));
      });

      await video.play();
      if (token !== cam.generation) return;

      updateGuide();

      const loaded = await modelTask;
      if (token !== cam.generation) return;
      if (loaded.error) throw loaded.error;

      cam.starting = false;
      cam.running = true;
      cam.lastFrame = -1;

      if (!selectedPlate) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }

      scheduleScan(token, 0);
    } catch (error) {
      if (token === cam.generation) cameraError(error);
    }
  }

  function scheduleScan(token, delay) {
    if (!allowed() || !cam.running || token !== cam.generation || document.hidden) return;
    clearTimeout(cam.timer);
    cam.timer = setTimeout(() => scan(token), delay);
  }

  async function scan(token) {
    if (!allowed() || !cam.running || token !== cam.generation || document.hidden) return;

    if (cam.busy) {
      scheduleScan(token, 50);
      return;
    }

    if (
      video.readyState < 2 ||
      !video.videoWidth || !video.videoHeight ||
      video.currentTime === cam.lastFrame
    ) {
      scheduleScan(token, 100);
      return;
    }

    cam.lastFrame = video.currentTime;
    cam.busy = true;

    const began = performance.now();
    let input;
    let outputs;

    try {
      updateGuide();
      input = makeTensor();

      outputs = await cam.session.run({
        [cam.session.inputNames[0]]: input
      });

      if (token !== cam.generation || !cam.running) return;
      acceptOcr(decode(outputs.plate));
    } catch (error) {
      if (token === cam.generation) cameraError(error);
    } finally {
      if (input) input.dispose();
      if (outputs) Object.values(outputs).forEach(output => output.dispose());

      cam.busy = false;

      scheduleScan(
        token,
        Math.max(0, CFG.scanMs - (performance.now() - began))
      );
    }
  }

  // ===================== KHỞI ĐỘNG =====================

  $('retryCamera').addEventListener('click', startCamera);
  video.addEventListener('loadedmetadata', updateGuide);
  video.addEventListener('resize', updateGuide);

  function resume() {
    if (document.hidden) return;
    if (auth.pending) void pollLogin();
    if (auth.token) {
      if (Date.now() >= auth.expiresAt) { closeSession('Phiên đã hết hạn. Vui lòng đăng nhập lại.'); return; }
      void loadSource();
      if (allowed()) void startCamera();
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopCamera(); clearTimeout(ut.timer); clearTimeout(auth.pollTimer);
      selectedPlate = ''; selectedUntil = 0; manualUntil = 0;
    } else {
      // Revalidate before restarting the camera after returning from background.
      auth.verifiedAt = 0;
      $('scannerContent').hidden = true;
      resume();
    }
  });
  window.addEventListener('pagehide', () => {
    stopCamera(); clearTimeout(ut.timer); clearTimeout(auth.pollTimer);
    auth.verifiedAt = 0;
  });
  window.addEventListener('pageshow', resume);
  window.addEventListener('focus', () => { if (auth.pending) void pollLogin(); });
  setInterval(() => {
    if (document.hidden) return;
    if (auth.token && (Date.now() >= auth.expiresAt ||
        (auth.verifiedAt > 0 && Date.now() - auth.verifiedAt >= 90000))) {
      closeSession('Chưa xác minh lại được quyền truy cập. Kiểm tra mạng rồi đăng nhập lại.');
      return;
    }
    sourceStatus(); refreshResult();
  }, 1000);
  // Remove obsolete shared-key storage. No secret or UT data is persisted.
  try {
    sessionStorage.removeItem('truck_check_session_v05');
    const saved = JSON.parse(sessionStorage.getItem(AUTH_STORAGE) || 'null');
    if (saved && /^[A-Za-z0-9_-]{43}$/.test(saved.token || '') && saved.expiresAt > Date.now()) {
      auth.token = saved.token; auth.expiresAt = saved.expiresAt;
      $('loginMessage').textContent = 'Đang kiểm tra phiên đăng nhập…';
    } else {
      const p = JSON.parse(sessionStorage.getItem(PENDING_STORAGE) || 'null');
      if (p && /^[a-f0-9]{64}$/.test(p.verifier || '') && /^[a-f0-9]{64}$/.test(p.challenge || '') && p.expiresAt > Date.now()) {
        auth.pending = p; showPending();
      }
    }
  } catch (_) {}
  resume();

})();
</script>
</body>
</html>
