<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d1d">
  <title>Truck Check</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #080d1d;
      color: #f1f5ff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      max-width: 560px;
      margin: auto;
      padding: 22px 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      color: #80cfff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 { margin: 8px 0 0; font-size: 30px; }

    #system {
      padding: 8px 10px;
      border-radius: 20px;
      background: #142139;
      color: #a9d9ff;
      font-size: 12px;
      white-space: nowrap;
    }

    .viewer {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      min-height: 160px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    #guide {
      position: absolute;
      outline: 2px solid #80cfff;
      border-radius: 10px;
      box-shadow: 0 0 0 1000px #0006;
      pointer-events: none;
    }

    #guide span {
      position: absolute;
      bottom: -26px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .card {
      margin-top: 18px;
      padding: 20px 16px;
      border: 1px solid #344661;
      border-radius: 18px;
      background: #111b30;
    }

    #result { text-align: center; }

    #result.priority {
      background: #112b22;
      border-color: #65c879;
    }

    #result.regular {
      background: #352219;
      border-color: #e4a678;
    }

    #plate {
      margin: 0;
      font-size: clamp(24px, 7vw, 36px);
      overflow-wrap: anywhere;
    }

    #resultText {
      margin: 12px 0 0;
      color: #c4d1e3;
      font-size: 19px;
      line-height: 1.5;
    }

    label { display: block; font-weight: 600; }

    input, button {
      font: inherit;
      border-radius: 10px;
      padding: 13px 11px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 1px solid #344661;
      background: #080d1d;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #3489c7;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: wait; }

    #manualForm {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #manualInput { flex: 1; text-transform: uppercase; }

    #connectionForm input,
    #connectionForm button {
      margin-top: 12px;
      width: 100%;
    }

    #retryCamera { width: 100%; margin-top: 12px; }

    .note, #sourceStatus, #connectionMessage {
      color: #9eb0cb;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #sourceStatus { text-align: center; }

    #settingsButton {
      display: block;
      margin: 0 auto;
      padding: 5px;
      background: transparent;
      color: #8195b3;
      font-size: 12px;
      font-weight: 400;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
</head>

<body>
<main>
  <header>
    <div>
      <div class="brand">BD MEGA · TRUCK CHECK</div>
      <h1>Quét BKS</h1>
    </div>
    <div id="system" role="status">Khởi động</div>
  </header>

  <section class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <div id="guide" hidden>
      <span>ĐƯA BKS VÀO GIỮA KHUNG</span>
    </div>
  </section>

  <button id="retryCamera" type="button" hidden>
    Chạm để mở lại camera
  </button>

  <section id="result" class="card" aria-live="polite" aria-atomic="true">
    <h2 id="plate">Đang chuẩn bị…</h2>
    <p id="resultText">Đang khởi động camera.</p>
  </section>

  <section class="card">
    <label for="manualInput">Nhập biển số dự phòng</label>
    <form id="manualForm">
      <input id="manualInput"
             placeholder="VD: 50E-504.74"
             maxlength="30"
             autocomplete="off"
             autocapitalize="characters"
             spellcheck="false"
             enterkeyhint="go"
             required>
      <button type="submit">Kiểm tra</button>
    </form>
  </section>

  <section id="connectionPanel" class="card">
    <label for="apiInput">Kết nối danh sách UT</label>
    <p class="note">
      Nhập Web app URL của Truck Check API và khóa kết nối.
      Thông tin được nhớ trong phiên của tab này.
    </p>

    <form id="connectionForm">
      <input id="apiInput"
             type="url"
             placeholder="https://script.google.com/macros/s/.../exec"
             autocomplete="off"
             spellcheck="false"
             required>

      <input id="keyInput"
             type="password"
             placeholder="Khóa UT_ACCESS_KEY"
             autocomplete="off"
             required>

      <button id="connectButton" type="submit">Kết nối</button>
    </form>

    <p id="connectionMessage" role="status"></p>
  </section>

  <p id="sourceStatus" role="status">Chưa kết nối danh sách UT.</p>
  <button id="settingsButton" type="button">Cài đặt kết nối</button>

  <canvas id="modelCanvas" width="128" height="64" hidden></canvas>
</main>

<script>
(() => {
  'use strict';

  const CONFIG = Object.freeze({
    modelUrl: new URL('./cct_xs_v2_global.onnx', location.href).href,
    runtimePath:
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
    alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_',
    scanIntervalMs: 300,
    stableRequired: 2,
    minMeanScore: 0.70,
    minCharScore: 0.40,
    resultHoldMs: 1800,
    manualHoldMs: 5000,
    sourceRefreshMs: 30000,
    maxDownloadAgeMs: 120000
  });

  const $ = id => document.getElementById(id);
  const video = $('video');
  const canvas = $('modelCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const STORAGE_KEY = 'truck_check_connection_v2';

  const camera = {
    session: null,
    modelPromise: null,
    stream: null,
    starting: false,
    running: false,
    busy: false,
    generation: 0,
    timer: null,
    lastFrame: -1,
    candidate: '',
    hits: 0,
    candidateAt: 0
  };

  const source = {
    url: '',
    key: '',
    snapshot: null,
    loading: false,
    timer: null,
    error: ''
  };

  let selectedPlate = '';
  let selectedUntil = 0;
  let manualUntil = 0;

  function normalizePlate(value) {
    return String(value || '')
      .toUpperCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '');
  }

  function validPlate(plate) {
    // Các dạng BKS phổ biến của nhóm xe đang thử nghiệm.
    return /^\d{2}[A-Z]{1,2}\d{4,5}$/.test(plate);
  }

  function render(plate, message, kind = '') {
    $('result').className = 'card' + (kind ? ' ' + kind : '');
    if ($('plate').textContent !== plate) $('plate').textContent = plate;
    if ($('resultText').textContent !== message) {
      $('resultText').textContent = message;
    }
  }

  function sourceUsable() {
    return source.snapshot &&
      Date.now() - source.snapshot.downloadedAt <=
        CONFIG.maxDownloadAgeMs;
  }

  function showLookup(plate) {
    if (!sourceUsable()) {
      render(plate, 'Chưa có dữ liệu UT khả dụng.');
      return;
    }

    const priority = source.snapshot.plates.has(plate);

    render(
      plate,
      priority ? 'Ưu tiên' : 'Không ưu tiên',
      priority ? 'priority' : 'regular'
    );
  }

  function refreshSelectedResult() {
    if (selectedPlate && performance.now() < selectedUntil) {
      showLookup(selectedPlate);
    } else if (selectedPlate) {
      selectedPlate = '';
      if (camera.running) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }
    }
  }

  function updateSourceStatus() {
    if (source.loading && !source.snapshot) {
      $('sourceStatus').textContent = 'Đang tải danh sách UT…';
    } else if (sourceUsable()) {
      $('sourceStatus').textContent =
        source.snapshot.plates.size + ' xe UT' +
        (source.error ? ' · Đang dùng bản đã tải' : ' · Đã kết nối');
    } else {
      $('sourceStatus').textContent =
        source.error ||
        (source.snapshot
          ? 'Danh sách UT chưa được tải lại. Đang kết nối…'
          : 'Chưa kết nối danh sách UT.');
    }
  }

  // ========================================================
  // API UT
  // ========================================================

  function validateApiUrl(value) {
    let url;

    try {
      url = new URL(value.trim());
    } catch {
      throw new Error('URL API không hợp lệ.');
    }

    if (
      url.protocol !== 'https:' ||
      url.hostname !== 'script.google.com' ||
      !/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname) ||
      url.search || url.hash || url.username || url.password
    ) {
      throw new Error(
        'Cần URL https://script.google.com/macros/s/.../exec của Truck Check API.'
      );
    }

    return url.href;
  }

  function saveConnection() {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        url: source.url,
        key: source.key
      }));
    } catch {
      // Nếu lưu bị chặn, thông tin vẫn được giữ trong bộ nhớ tab.
    }
  }

  function clearSavedConnection() {
    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch {}
  }

  function scheduleSource() {
    clearTimeout(source.timer);

    if (source.url && source.key && !document.hidden) {
      source.timer = setTimeout(loadSource, CONFIG.sourceRefreshMs);
    }
  }

  async function loadSource() {
    if (source.loading || !source.url || !source.key) return;

    source.loading = true;
    clearTimeout(source.timer);
    $('connectButton').disabled = true;
    updateSourceStatus();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);

    try {
      const endpoint = validateApiUrl(source.url);

      const response = await fetch(endpoint, {
        method: 'POST',
        redirect: 'follow',
        credentials: 'omit',
        headers: {
          'Content-Type': 'text/plain;charset=UTF-8'
        },
        body: JSON.stringify({
          action: 'source',
          key: source.key
        }),
        signal: controller.signal
      });

      if (response.status === 405) {
        throw new Error(
          'HTTP 405: kiểm tra URL API, hàm doPost và deployment New version.'
        );
      }

      if (!response.ok) {
        throw new Error('API trả HTTP ' + response.status);
      }

      let payload;

      try {
        payload = await response.json();
      } catch {
        throw new Error(
          'API không trả JSON. Kiểm tra đúng deployment API và quyền Anyone.'
        );
      }

      if (!payload || payload.ok !== true) {
        if (payload && payload.code === 'UNAUTHORIZED') {
          source.key = '';
          source.snapshot = null;
          clearSavedConnection();
          $('connectionPanel').hidden = false;
        }

        throw new Error(
          payload && payload.message
            ? payload.message
            : 'API từ chối yêu cầu.'
        );
      }

      if (
        payload.sourceType !== 'CURRENT_UT_LIST' ||
        !Array.isArray(payload.plates) ||
        payload.plates.length === 0 ||
        payload.plates.some(plate =>
          typeof plate !== 'string' ||
          !plate ||
          plate !== normalizePlate(plate) ||
          !/[A-Z]/.test(plate) ||
          !/[0-9]/.test(plate)
        )
      ) {
        throw new Error('Dữ liệu UT không đúng cấu trúc.');
      }

      const plates = new Set(payload.plates);

      if (
        plates.size !== payload.plates.length ||
        plates.size !== payload.count
      ) {
        throw new Error('Số lượng BKS UT không khớp.');
      }

      source.snapshot = {
        plates,
        downloadedAt: Date.now()
      };

      source.error = '';
      saveConnection();

      $('keyInput').value = '';
      $('connectionMessage').textContent = '';
      $('connectionPanel').hidden = true;

    } catch (error) {
      source.error =
        error.name === 'AbortError'
          ? 'Tải UT quá lâu. Đang thử kết nối lại.'
          : (
              error.message === 'Failed to fetch'
                ? 'Không gọi được API. Kiểm tra mạng, URL và quyền deployment.'
                : error.message
            );

      $('connectionMessage').textContent = source.error;

      if (!source.snapshot) {
        $('connectionPanel').hidden = false;
      }
    } finally {
      clearTimeout(timeout);
      source.loading = false;
      $('connectButton').disabled = false;
      updateSourceStatus();
      refreshSelectedResult();
      scheduleSource();
    }
  }

  $('connectionForm').addEventListener('submit', event => {
    event.preventDefault();
    if (source.loading) return;

    try {
      const url = validateApiUrl($('apiInput').value);
      const key = $('keyInput').value.trim();

      if (!key) {
        throw new Error('Vui lòng nhập khóa UT_ACCESS_KEY.');
      }

      // Đổi kết nối thì bỏ dữ liệu của kết nối trước.
      if (url !== source.url || key !== source.key) {
        source.snapshot = null;
        clearSavedConnection();
      }

      source.url = url;
      source.key = key;
      source.error = '';
      $('connectionMessage').textContent = 'Đang kết nối…';

      refreshSelectedResult();
      loadSource();
    } catch (error) {
      $('connectionMessage').textContent = error.message;
    }
  });

  $('settingsButton').addEventListener('click', () => {
    $('connectionPanel').hidden = !$('connectionPanel').hidden;
    $('apiInput').value = source.url;
    // Không điền lại khóa vào giao diện.
  });

  // ========================================================
  // NHẬP TAY
  // ========================================================

  $('manualForm').addEventListener('submit', event => {
    event.preventDefault();

    const plate = normalizePlate($('manualInput').value);
    manualUntil = performance.now() + CONFIG.manualHoldMs;

    camera.candidate = '';
    camera.hits = 0;

    if (!validPlate(plate)) {
      selectedPlate = '';
      render(
        'Kiểm tra lại BKS',
        'Ví dụ: 50E-504.74 hoặc 50E50474.'
      );
      return;
    }

    selectedPlate = plate;
    selectedUntil = manualUntil;

    showLookup(plate);

    $('manualInput').value = plate;
    $('manualInput').blur();
  });

  // ========================================================
  // MODEL ONNX
  // ========================================================

  async function loadModel() {
    if (camera.session) return camera.session;
    if (camera.modelPromise) return camera.modelPromise;

    camera.modelPromise = (async () => {
      if (!window.ort) {
        throw new Error('Không tải được thư viện OCR. Hãy tải lại trang.');
      }

      ort.env.wasm.wasmPaths = CONFIG.runtimePath;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      let bytes;

      try {
        const response = await fetch(CONFIG.modelUrl, {
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('Tải model lỗi HTTP ' + response.status);
        }

        bytes = await response.arrayBuffer();
      } finally {
        clearTimeout(timeout);
      }

      const session = await ort.InferenceSession.create(bytes, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all'
      });

      if (!session.outputNames.includes('plate')) {
        await session.release();
        throw new Error('Model không có đầu ra plate.');
      }

      camera.session = session;
      return session;
    })();

    try {
      return await camera.modelPromise;
    } finally {
      camera.modelPromise = null;
    }
  }

  function getRoi() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    let width = vw * 0.86;
    let height = width / 2;

    if (height > vh * 0.48) {
      height = vh * 0.48;
      width = height * 2;
    }

    return {
      x: (vw - width) / 2,
      y: (vh - height) / 2,
      width,
      height
    };
  }

  function updateGuide() {
    if (!video.videoWidth || !video.videoHeight) return;

    const roi = getRoi();
    const guide = $('guide');

    guide.style.left = roi.x / video.videoWidth * 100 + '%';
    guide.style.top = roi.y / video.videoHeight * 100 + '%';
    guide.style.width = roi.width / video.videoWidth * 100 + '%';
    guide.style.height = roi.height / video.videoHeight * 100 + '%';
    guide.hidden = false;
  }

  function makeTensor() {
    const roi = getRoi();

    ctx.drawImage(
      video,
      roi.x, roi.y, roi.width, roi.height,
      0, 0, 128, 64
    );

    const rgba = ctx.getImageData(0, 0, 128, 64).data;
    const rgb = new Uint8Array(128 * 64 * 3);

    for (let i = 0, j = 0; i < rgba.length; i += 4) {
      rgb[j++] = rgba[i];
      rgb[j++] = rgba[i + 1];
      rgb[j++] = rgba[i + 2];
    }

    return new ort.Tensor('uint8', rgb, [1, 64, 128, 3]);
  }

  function decode(output) {
    if (
      !output ||
      output.dims.length !== 3 ||
      output.dims[0] !== 1 ||
      output.dims[1] !== 10 ||
      output.dims[2] !== 37
    ) {
      throw new Error('Đầu ra OCR không đúng cấu hình.');
    }

    let plate = '';
    let total = 0;
    let minimum = 1;
    let count = 0;

    for (let slot = 0; slot < 10; slot++) {
      const offset = slot * 37;
      let best = 0;
      let maximum = -Infinity;
      let lowest = Infinity;
      let sum = 0;

      for (let j = 0; j < 37; j++) {
        const value = Number(output.data[offset + j]);

        if (!Number.isFinite(value)) {
          throw new Error('Điểm OCR không hợp lệ.');
        }

        sum += value;
        lowest = Math.min(lowest, value);

        if (value > maximum) {
          maximum = value;
          best = j;
        }
      }

      let confidence = maximum;

      if (!(lowest >= 0 && maximum <= 1 && Math.abs(sum - 1) < 0.08)) {
        let denominator = 0;

        for (let j = 0; j < 37; j++) {
          denominator += Math.exp(output.data[offset + j] - maximum);
        }

        confidence = 1 / denominator;
      }

      const character = CONFIG.alphabet[best];

      if (character !== '_') {
        plate += character;
        total += confidence;
        minimum = Math.min(minimum, confidence);
        count++;
      }
    }

    return {
      plate,
      mean: count ? total / count : 0,
      minimum: count ? minimum : 0
    };
  }

  function acceptOcr(result) {
    const now = performance.now();

    if (
      document.activeElement === $('manualInput') ||
      now < manualUntil
    ) {
      camera.candidate = '';
      camera.hits = 0;
      return;
    }

    const good =
      validPlate(result.plate) &&
      result.mean >= CONFIG.minMeanScore &&
      result.minimum >= CONFIG.minCharScore;

    if (good) {
      const same =
        result.plate === camera.candidate &&
        now - camera.candidateAt <= 2000;

      camera.hits = same ? camera.hits + 1 : 1;
      camera.candidate = result.plate;
      camera.candidateAt = now;

      if (camera.hits >= CONFIG.stableRequired) {
        selectedPlate = result.plate;
        selectedUntil = now + CONFIG.resultHoldMs;
        showLookup(selectedPlate);
        return;
      }
    } else {
      camera.candidate = '';
      camera.hits = 0;
    }

    if (now >= selectedUntil) {
      selectedPlate = '';
      render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
    }
  }

  // ========================================================
  // CAMERA + QUÉT LIÊN TỤC
  // ========================================================

  function stopCamera() {
    camera.generation++;
    clearTimeout(camera.timer);

    camera.running = false;
    camera.starting = false;
    camera.candidate = '';
    camera.hits = 0;
    camera.lastFrame = -1;

    if (camera.stream) {
      camera.stream.getTracks().forEach(track => track.stop());
      camera.stream = null;
    }

    video.pause();
    video.srcObject = null;
    $('guide').hidden = true;
  }

  function cameraError(error) {
    stopCamera();

    $('system').textContent = 'Camera/OCR lỗi';
    $('retryCamera').hidden = false;
    $('retryCamera').disabled = false;

    const messages = {
      NotAllowedError: 'Cho phép camera rồi chạm để thử lại.',
      NotFoundError: 'Không tìm thấy camera.',
      NotReadableError: 'Camera đang bận hoặc không đọc được.',
      AbortError: 'Tải model quá lâu. Kiểm tra mạng rồi thử lại.'
    };

    const message = messages[error.name] || error.message;

    // Lỗi camera không chặn chức năng nhập tay.
    $('retryCamera').textContent = message + ' · Thử lại';

    if (!selectedPlate) {
      render('Camera chưa sẵn sàng', 'Bạn vẫn có thể nhập BKS bên dưới.');
    }
  }

  async function startCamera() {
    if (camera.starting || camera.running || document.hidden) return;

    const token = ++camera.generation;
    camera.starting = true;

    $('retryCamera').hidden = true;
    $('retryCamera').disabled = true;
    $('system').textContent = 'Khởi động';

    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('Mở trang HTTPS trực tiếp bằng Safari hoặc Chrome.');
      }

      const modelTask = loadModel().then(
        value => ({ value }),
        error => ({ error })
      );

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      if (token !== camera.generation || document.hidden) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }

      camera.stream = stream;
      video.srcObject = stream;

      stream.getVideoTracks()[0].addEventListener('ended', () => {
        if (token === camera.generation) {
          cameraError(new Error('Camera đã ngắt.'));
        }
      });

      await video.play();
      if (token !== camera.generation) return;

      updateGuide();

      const loaded = await modelTask;
      if (token !== camera.generation) return;
      if (loaded.error) throw loaded.error;

      camera.starting = false;
      camera.running = true;
      camera.lastFrame = -1;

      $('system').textContent = 'Đang quét';

      if (!selectedPlate) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }

      scheduleScan(token, 0);
    } catch (error) {
      if (token === camera.generation) cameraError(error);
    }
  }

  function scheduleScan(token, delay) {
    if (!camera.running || token !== camera.generation || document.hidden) return;
    clearTimeout(camera.timer);
    camera.timer = setTimeout(() => scan(token), delay);
  }

  async function scan(token) {
    if (!camera.running || token !== camera.generation || document.hidden) return;

    if (camera.busy) {
      scheduleScan(token, 50);
      return;
    }

    if (
      video.readyState < 2 ||
      !video.videoWidth ||
      !video.videoHeight ||
      video.currentTime === camera.lastFrame
    ) {
      scheduleScan(token, 100);
      return;
    }

    camera.lastFrame = video.currentTime;
    camera.busy = true;

    const began = performance.now();
    let input;
    let outputs;

    try {
      updateGuide();
      input = makeTensor();

      outputs = await camera.session.run({
        [camera.session.inputNames[0]]: input
      });

      if (token !== camera.generation || !camera.running) return;

      acceptOcr(decode(outputs.plate));
    } catch (error) {
      if (token === camera.generation) cameraError(error);
    } finally {
      if (input) input.dispose();
      if (outputs) Object.values(outputs).forEach(output => output.dispose());

      camera.busy = false;

      scheduleScan(
        token,
        Math.max(0, CONFIG.scanIntervalMs - (performance.now() - began))
      );
    }
  }

  // ========================================================
  // KHỞI ĐỘNG / QUAY LẠI TAB
  // ========================================================

  $('retryCamera').addEventListener('click', startCamera);
  video.addEventListener('loadedmetadata', updateGuide);
  video.addEventListener('resize', updateGuide);

  function resume() {
    if (document.hidden) return;
    startCamera();
    if (source.url && source.key) loadSource();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopCamera();
      clearTimeout(source.timer);
      selectedPlate = '';
      selectedUntil = 0;
      manualUntil = 0;
      $('system').textContent = 'Tạm dừng';
      render('Đã tạm dừng', 'Quay lại trang để tiếp tục.');
    } else {
      resume();
    }
  });

  window.addEventListener('pagehide', () => {
    stopCamera();
    clearTimeout(source.timer);
  });

  window.addEventListener('pageshow', resume);

  // Cập nhật trạng thái khi bản tải xuống quá hạn hoặc kết quả cũ hết hạn.
  setInterval(() => {
    if (!document.hidden) {
      updateSourceStatus();
      refreshSelectedResult();
    }
  }, 1000);

  try {
    const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');

    if (saved && typeof saved.key === 'string' && saved.key) {
      source.url = validateApiUrl(saved.url);
      source.key = saved.key;
      $('apiInput').value = source.url;
      $('connectionPanel').hidden = true;
    }
  } catch {
    clearSavedConnection();
  }

  resume();
})();
</script>
</body>
</html>
