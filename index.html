<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1d">
<title>Truck Check V05</title>

<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: #080d1d;
    color: #eef4ff;
    font-family: system-ui, -apple-system, sans-serif;
  }

  main {
    max-width: 560px;
    padding: 22px 16px;
    margin: auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    color: #80cfff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  h1 { margin: 8px 0 0; font-size: 30px; }

  .badge {
    padding: 8px 12px;
    background: #142139;
    color: #a9d9ff;
    border-radius: 20px;
    font-size: 12px;
  }

  .viewer {
    position: relative;
    min-height: 160px;
    overflow: hidden;
    background: #000;
    border-radius: 18px;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
  }

  #guide {
    position: absolute;
    outline: 2px solid #80cfff;
    border-radius: 10px;
    box-shadow: 0 0 0 1000px #0006;
    pointer-events: none;
  }

  #guide span {
    position: absolute;
    bottom: -25px;
    width: 100%;
    font-size: 10px;
    text-align: center;
  }

  .card {
    margin-top: 18px;
    padding: 20px 16px;
    background: #111b30;
    border: 1px solid #344661;
    border-radius: 18px;
  }

  #result { text-align: center; }

  #result.priority {
    background: #112b22;
    border-color: #65c879;
  }

  #result.regular {
    background: #352219;
    border-color: #e4a678;
  }

  #plate {
    margin: 0;
    font-size: clamp(24px, 7vw, 36px);
    overflow-wrap: anywhere;
  }

  #resultText {
    font-size: 18px;
    color: #c4d1e3;
    line-height: 1.6;
    margin-bottom: 0;
  }

  label {
    display: block;
    margin: 12px 0 8px;
    font-weight: 600;
    font-size: 14px;
  }

  input, button {
    font: inherit;
    font-size: 16px;
    border-radius: 10px;
    padding: 13px 11px;
  }

  input {
    width: 100%;
    min-width: 0;
    color: white;
    background: #080d1d;
    border: 1px solid #344661;
  }

  input:focus {
    outline: 2px solid #3489c7;
  }

  button {
    border: 0;
    color: white;
    background: #3489c7;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled { opacity: .5; cursor: wait; }

  #manualForm {
    display: flex;
    gap: 8px;
  }

  #manualInput { flex: 1; text-transform: uppercase; }

  #connectButton, #retryCamera {
    width: 100%;
    margin-top: 12px;
  }

  summary { cursor: pointer; font-weight: 700; }

  .note, #sourceStatus, #connectionMessage, footer {
    font-size: 12px;
    color: #a5b6ce;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  #connectionMessage {
    white-space: pre-line;
    color: #ffd39a;
  }

  #sourceStatus, footer { text-align: center; }

  footer { margin-top: 18px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
</head>

<body>
<main>
  <header>
    <div>
      <div class="brand">BD MEGA · TRUCK CHECK</div>
      <h1>Quét BKS</h1>
    </div>
    <span class="badge">V05</span>
  </header>

  <section class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <div id="guide" hidden>
      <span>ĐƯA BKS VÀO GIỮA KHUNG</span>
    </div>
  </section>

  <button id="retryCamera" type="button" hidden>
    Chạm để mở lại camera
  </button>

  <section id="result" class="card"
           aria-live="polite" aria-atomic="true">
    <h2 id="plate">Đang chuẩn bị…</h2>
    <p id="resultText">Đang khởi động camera.</p>
  </section>

  <section class="card">
    <label for="manualInput">Nhập biển số dự phòng</label>
    <form id="manualForm">
      <input id="manualInput"
             placeholder="VD: 50E-504.74"
             maxlength="30"
             autocomplete="off"
             autocapitalize="characters"
             spellcheck="false"
             required>
      <button type="submit">Kiểm tra</button>
    </form>
  </section>

  <details id="connectionPanel" class="card" open>
    <summary>Cài đặt kết nối UT</summary>

    <form id="connectionForm">
      <label for="apiInput">Web app URL Apps Script</label>
      <input id="apiInput"
             type="url"
             placeholder="https://script.google.com/macros/s/.../exec"
             autocomplete="off"
             autocapitalize="off"
             spellcheck="false"
             required>

      <p class="note">
        Dán URL của project Truck Check API có hàm doPost.
        Không dùng URL GitHub hoặc URL editor Apps Script.
      </p>

      <label for="keyInput">Khóa UT_ACCESS_KEY</label>
      <input id="keyInput"
             type="password"
             placeholder="Nhập khóa đã đặt trong Script properties"
             autocomplete="off"
             required>

      <button id="connectButton" type="submit">
        Lưu và kết nối
      </button>
    </form>

    <p id="connectionMessage" role="status"></p>
  </details>

  <p id="sourceStatus" role="status">
    Chưa kết nối danh sách UT.
  </p>

  <footer>Truck Check V05 · Chưa ghi log lượt quét</footer>

  <canvas id="modelCanvas" width="128" height="64" hidden></canvas>
</main>

<script>
(() => {
  'use strict';

  // Có thể điền URL cố định ở đây, hoặc nhập ngay trên giao diện.
  // Không điền khóa truy cập vào code GitHub.
  const UT_API_URL = '';

  const CFG = Object.freeze({
    modelUrl: new URL('./cct_xs_v2_global.onnx', location.href).href,
    runtimePath:
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',
    alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_',
    scanMs: 300,
    stableRequired: 2,
    minMean: 0.70,
    minChar: 0.40,
    refreshMs: 30000,
    maxSourceAgeMs: 120000,
    ocrHoldMs: 1800,
    manualHoldMs: 5000
  });

  const $ = id => document.getElementById(id);
  const video = $('video');
  const canvas = $('modelCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const URL_STORAGE = 'truck_check_api_url_v05';
  const SESSION_STORAGE = 'truck_check_session_v05';

  const ut = {
    url: '',
    key: '',
    snapshot: null,
    loading: false,
    timer: null,
    error: '',
    blocked: false
  };

  const cam = {
    session: null,
    modelPromise: null,
    stream: null,
    starting: false,
    running: false,
    busy: false,
    generation: 0,
    timer: null,
    lastFrame: -1,
    candidate: '',
    hits: 0,
    candidateAt: 0
  };

  let selectedPlate = '';
  let selectedUntil = 0;
  let manualUntil = 0;

  function normalize(value) {
    return String(value || '')
      .toUpperCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '');
  }

  function plausible(plate) {
    return /^\d{2}[A-Z]{1,2}\d{4,5}$/.test(plate);
  }

  function render(plate, message, kind = '') {
    $('result').className = 'card' + (kind ? ' ' + kind : '');
    if ($('plate').textContent !== plate) $('plate').textContent = plate;
    if ($('resultText').textContent !== message) {
      $('resultText').textContent = message;
    }
  }

  function sourceReady() {
    return !!ut.snapshot &&
      Date.now() - ut.snapshot.downloadedAt <= CFG.maxSourceAgeMs;
  }

  function lookup(plate) {
    if (!sourceReady()) {
      render(plate, 'Chưa có dữ liệu UT khả dụng.');
      return;
    }

    const priority = ut.snapshot.plates.has(plate);
    render(
      plate,
      priority ? 'Ưu tiên' : 'Không ưu tiên',
      priority ? 'priority' : 'regular'
    );
  }

  function refreshResult() {
    if (!selectedPlate) return;

    if (performance.now() < selectedUntil) {
      lookup(selectedPlate);
    } else {
      selectedPlate = '';
      if (cam.running) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }
    }
  }

  function sourceStatus() {
    if (ut.loading && !ut.snapshot) {
      $('sourceStatus').textContent = 'Đang kết nối API…';
    } else if (sourceReady()) {
      $('sourceStatus').textContent =
        ut.snapshot.plates.size + ' xe UT · ' +
        (ut.error ? 'Đang dùng bản đã tải' : 'Đã kết nối');
    } else {
      $('sourceStatus').textContent =
        ut.error || 'Chưa kết nối danh sách UT.';
    }
  }

  function validateUrl(raw) {
    let url;

    try {
      url = new URL(String(raw || '').trim());
    } catch {
      throw new Error('Bạn chưa nhập Web app URL hợp lệ.');
    }

    if (
      url.protocol !== 'https:' ||
      url.hostname !== 'script.google.com' ||
      !/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname) ||
      url.search || url.hash || url.username || url.password
    ) {
      throw new Error(
        'URL phải có dạng https://script.google.com/macros/s/.../exec'
      );
    }

    return url.href;
  }

  function forgetSession() {
    try { sessionStorage.removeItem(SESSION_STORAGE); } catch {}
  }

  function saveConnection() {
    try { localStorage.setItem(URL_STORAGE, ut.url); } catch {}
    try {
      sessionStorage.setItem(SESSION_STORAGE, JSON.stringify({
        url: ut.url,
        key: ut.key
      }));
    } catch {}
  }

  function scheduleSource() {
    clearTimeout(ut.timer);

    if (ut.url && ut.key && !ut.blocked && !document.hidden) {
      ut.timer = setTimeout(loadSource, CFG.refreshMs);
    }
  }

  async function loadSource() {
    if (ut.loading || !ut.url || !ut.key || ut.blocked) return;

    ut.loading = true;
    clearTimeout(ut.timer);
    $('connectButton').disabled = true;
    $('connectionMessage').textContent = 'Đang gọi API…';
    sourceStatus();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);

    try {
      const endpoint = validateUrl(ut.url);

      const response = await fetch(endpoint, {
        method: 'POST',
        redirect: 'follow',
        credentials: 'omit',
        headers: {
          'Content-Type': 'text/plain;charset=UTF-8'
        },
        body: JSON.stringify({
          action: 'source',
          key: ut.key
        }),
        signal: controller.signal
      });

      if (!response.ok) {
        if ([401, 403, 404, 405].includes(response.status)) {
          ut.blocked = true;
        }

        if (response.status === 405) {
          throw new Error(
            'HTTP 405: endpoint không nhận POST.\n' +
            'Trong Truck Check API, kiểm tra có doPost(e), ' +
            'sau đó Deploy → Manage deployments → New version.\n' +
            'Copy đúng URL /exec của deployment API vào ô phía trên.'
          );
        }

        throw new Error('API trả HTTP ' + response.status);
      }

      let payload;
      try {
        payload = await response.json();
      } catch {
        ut.blocked = true;
        throw new Error(
          'API trả trang HTML thay vì JSON. Kiểm tra đúng URL API, ' +
          'Execute as: Me và Who has access: Anyone.'
        );
      }

      if (!payload || payload.ok !== true) {
        if (
          payload &&
          ['UNAUTHORIZED', 'NOT_CONFIGURED', 'INVALID_ACTION']
            .includes(payload.code)
        ) {
          ut.blocked = true;
        }

        if (payload && payload.code === 'UNAUTHORIZED') {
          ut.snapshot = null;
          forgetSession();
        }

        throw new Error(
          payload && payload.message
            ? payload.message
            : 'API không trả kết quả hợp lệ.'
        );
      }

      if (
        payload.sourceType !== 'CURRENT_UT_LIST' ||
        !Array.isArray(payload.plates) ||
        !payload.plates.length ||
        payload.plates.some(plate =>
          typeof plate !== 'string' ||
          !plate ||
          plate !== normalize(plate) ||
          !/[A-Z]/.test(plate) ||
          !/[0-9]/.test(plate)
        )
      ) {
        ut.blocked = true;
        throw new Error('API trả dữ liệu không đúng cấu trúc CURRENT_UT_LIST.');
      }

      const plates = new Set(payload.plates);

      if (
        plates.size !== payload.count ||
        plates.size !== payload.plates.length
      ) {
        throw new Error('Số lượng BKS UT không khớp.');
      }

      ut.snapshot = {
        plates,
        downloadedAt: Date.now()
      };

      ut.error = '';
      saveConnection();

      $('keyInput').value = '';
      $('connectionMessage').textContent =
        'Kết nối thành công. Danh sách tự tải lại mỗi 30 giây.';
      $('connectionPanel').open = false;

    } catch (error) {
      ut.error = error.name === 'AbortError'
        ? 'Kết nối quá 25 giây. Kiểm tra mạng và deployment.'
        : error.message;

      if (ut.error === 'Failed to fetch') {
        ut.error =
          'Trình duyệt không đọc được phản hồi API. ' +
          'Kiểm tra mạng, quyền deployment và lượt chạy doPost trong Executions.';
      }

      $('connectionMessage').textContent = ut.error;
      if (!sourceReady() || ut.blocked) $('connectionPanel').open = true;

    } finally {
      clearTimeout(timeout);
      ut.loading = false;
      $('connectButton').disabled = false;
      sourceStatus();
      refreshResult();
      scheduleSource();
    }
  }

  $('connectionForm').addEventListener('submit', event => {
    event.preventDefault();
    if (ut.loading) return;

    try {
      const url = validateUrl($('apiInput').value);
      const key = $('keyInput').value.trim() ||
        (url === ut.url ? ut.key : '');

      if (!key) throw new Error('Bạn chưa nhập khóa UT_ACCESS_KEY.');

      if (url !== ut.url || key !== ut.key) {
        ut.snapshot = null;
        forgetSession();
      }

      ut.url = url;
      ut.key = key;
      ut.error = '';
      ut.blocked = false;

      try { localStorage.setItem(URL_STORAGE, url); } catch {}

      refreshResult();
      loadSource();
    } catch (error) {
      $('connectionMessage').textContent = error.message;
    }
  });

  $('manualForm').addEventListener('submit', event => {
    event.preventDefault();

    const plate = normalize($('manualInput').value);
    manualUntil = performance.now() + CFG.manualHoldMs;
    cam.candidate = '';
    cam.hits = 0;

    if (!plausible(plate)) {
      selectedPlate = '';
      render('Kiểm tra lại BKS', 'Ví dụ: 50E-504.74 hoặc 50E50474.');
      return;
    }

    selectedPlate = plate;
    selectedUntil = manualUntil;
    lookup(plate);

    $('manualInput').value = plate;
    $('manualInput').blur();
  });

  // ===================== ONNX =====================

  async function loadModel() {
    if (cam.session) return cam.session;
    if (cam.modelPromise) return cam.modelPromise;

    cam.modelPromise = (async () => {
      if (!window.ort) {
        throw new Error('Không tải được thư viện OCR. Hãy tải lại trang.');
      }

      ort.env.wasm.wasmPaths = CFG.runtimePath;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      let bytes;

      try {
        const response = await fetch(CFG.modelUrl, {
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('Tải model lỗi HTTP ' + response.status);
        }

        bytes = await response.arrayBuffer();
      } finally {
        clearTimeout(timeout);
      }

      const session = await ort.InferenceSession.create(bytes, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all'
      });

      if (!session.outputNames.includes('plate')) {
        await session.release();
        throw new Error('Model không có đầu ra plate.');
      }

      cam.session = session;
      return session;
    })();

    try {
      return await cam.modelPromise;
    } finally {
      cam.modelPromise = null;
    }
  }

  function getRoi() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    let width = vw * 0.86;
    let height = width / 2;

    if (height > vh * 0.48) {
      height = vh * 0.48;
      width = height * 2;
    }

    return {
      x: (vw - width) / 2,
      y: (vh - height) / 2,
      width,
      height
    };
  }

  function updateGuide() {
    if (!video.videoWidth || !video.videoHeight) return;

    const roi = getRoi();
    const guide = $('guide');

    guide.style.left = roi.x / video.videoWidth * 100 + '%';
    guide.style.top = roi.y / video.videoHeight * 100 + '%';
    guide.style.width = roi.width / video.videoWidth * 100 + '%';
    guide.style.height = roi.height / video.videoHeight * 100 + '%';
    guide.hidden = false;
  }

  function makeTensor() {
    const roi = getRoi();

    ctx.drawImage(
      video,
      roi.x, roi.y, roi.width, roi.height,
      0, 0, 128, 64
    );

    const rgba = ctx.getImageData(0, 0, 128, 64).data;
    const rgb = new Uint8Array(128 * 64 * 3);

    for (let i = 0, j = 0; i < rgba.length; i += 4) {
      rgb[j++] = rgba[i];
      rgb[j++] = rgba[i + 1];
      rgb[j++] = rgba[i + 2];
    }

    return new ort.Tensor('uint8', rgb, [1, 64, 128, 3]);
  }

  function decode(output) {
    if (
      !output || output.dims.length !== 3 ||
      output.dims[0] !== 1 ||
      output.dims[1] !== 10 ||
      output.dims[2] !== 37
    ) {
      throw new Error('Đầu ra OCR không đúng cấu hình.');
    }

    let plate = '';
    let total = 0;
    let minimum = 1;
    let count = 0;

    for (let slot = 0; slot < 10; slot++) {
      const offset = slot * 37;
      let best = 0;
      let maximum = -Infinity;
      let lowest = Infinity;
      let sum = 0;

      for (let j = 0; j < 37; j++) {
        const value = Number(output.data[offset + j]);
        if (!Number.isFinite(value)) throw new Error('Điểm OCR không hợp lệ.');

        sum += value;
        lowest = Math.min(lowest, value);

        if (value > maximum) {
          maximum = value;
          best = j;
        }
      }

      let confidence = maximum;

      if (!(lowest >= 0 && maximum <= 1 && Math.abs(sum - 1) < 0.08)) {
        let denominator = 0;

        for (let j = 0; j < 37; j++) {
          denominator += Math.exp(output.data[offset + j] - maximum);
        }

        confidence = 1 / denominator;
      }

      const character = CFG.alphabet[best];

      if (character !== '_') {
        plate += character;
        total += confidence;
        minimum = Math.min(minimum, confidence);
        count++;
      }
    }

    return {
      plate,
      mean: count ? total / count : 0,
      minimum: count ? minimum : 0
    };
  }

  function acceptOcr(result) {
    const now = performance.now();

    if (document.activeElement === $('manualInput') || now < manualUntil) {
      cam.candidate = '';
      cam.hits = 0;
      return;
    }

    const good = plausible(result.plate) &&
      result.mean >= CFG.minMean &&
      result.minimum >= CFG.minChar;

    if (good) {
      const same = result.plate === cam.candidate &&
        now - cam.candidateAt <= 2000;

      cam.hits = same ? cam.hits + 1 : 1;
      cam.candidate = result.plate;
      cam.candidateAt = now;

      if (cam.hits >= CFG.stableRequired) {
        selectedPlate = result.plate;
        selectedUntil = now + CFG.ocrHoldMs;
        lookup(selectedPlate);
        return;
      }
    } else {
      cam.candidate = '';
      cam.hits = 0;
    }

    if (now >= selectedUntil) {
      selectedPlate = '';
      render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
    }
  }

  // ===================== CAMERA =====================

  function stopCamera() {
    cam.generation++;
    clearTimeout(cam.timer);
    cam.running = false;
    cam.starting = false;
    cam.candidate = '';
    cam.hits = 0;
    cam.lastFrame = -1;

    if (cam.stream) {
      cam.stream.getTracks().forEach(track => track.stop());
      cam.stream = null;
    }

    video.pause();
    video.srcObject = null;
    $('guide').hidden = true;
  }

  function cameraError(error) {
    stopCamera();

    const messages = {
      NotAllowedError: 'Cần cho phép truy cập camera.',
      NotFoundError: 'Không tìm thấy camera.',
      NotReadableError: 'Camera đang bận hoặc không đọc được.',
      AbortError: 'Tải OCR quá lâu. Kiểm tra mạng.'
    };

    $('retryCamera').hidden = false;
    $('retryCamera').disabled = false;
    $('retryCamera').textContent =
      (messages[error.name] || error.message) + ' · Thử lại';

    if (!selectedPlate) {
      render('Camera chưa sẵn sàng', 'Bạn vẫn có thể nhập BKS bên dưới.');
    }
  }

  async function startCamera() {
    if (cam.starting || cam.running || document.hidden) return;

    const token = ++cam.generation;
    cam.starting = true;
    $('retryCamera').hidden = true;
    $('retryCamera').disabled = true;

    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('Mở trang HTTPS bằng Safari hoặc Chrome.');
      }

      const modelTask = loadModel().then(
        value => ({ value }),
        error => ({ error })
      );

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      if (token !== cam.generation || document.hidden) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }

      cam.stream = stream;
      video.srcObject = stream;

      stream.getVideoTracks()[0].addEventListener('ended', () => {
        if (token === cam.generation) cameraError(new Error('Camera đã ngắt.'));
      });

      await video.play();
      if (token !== cam.generation) return;

      updateGuide();

      const loaded = await modelTask;
      if (token !== cam.generation) return;
      if (loaded.error) throw loaded.error;

      cam.starting = false;
      cam.running = true;
      cam.lastFrame = -1;

      if (!selectedPlate) {
        render('Đang tìm biển số…', 'Đưa BKS vào giữa khung.');
      }

      scheduleScan(token, 0);
    } catch (error) {
      if (token === cam.generation) cameraError(error);
    }
  }

  function scheduleScan(token, delay) {
    if (!cam.running || token !== cam.generation || document.hidden) return;
    clearTimeout(cam.timer);
    cam.timer = setTimeout(() => scan(token), delay);
  }

  async function scan(token) {
    if (!cam.running || token !== cam.generation || document.hidden) return;

    if (cam.busy) {
      scheduleScan(token, 50);
      return;
    }

    if (
      video.readyState < 2 ||
      !video.videoWidth || !video.videoHeight ||
      video.currentTime === cam.lastFrame
    ) {
      scheduleScan(token, 100);
      return;
    }

    cam.lastFrame = video.currentTime;
    cam.busy = true;

    const began = performance.now();
    let input;
    let outputs;

    try {
      updateGuide();
      input = makeTensor();

      outputs = await cam.session.run({
        [cam.session.inputNames[0]]: input
      });

      if (token !== cam.generation || !cam.running) return;
      acceptOcr(decode(outputs.plate));
    } catch (error) {
      if (token === cam.generation) cameraError(error);
    } finally {
      if (input) input.dispose();
      if (outputs) Object.values(outputs).forEach(output => output.dispose());

      cam.busy = false;

      scheduleScan(
        token,
        Math.max(0, CFG.scanMs - (performance.now() - began))
      );
    }
  }

  // ===================== KHỞI ĐỘNG =====================

  $('retryCamera').addEventListener('click', startCamera);
  video.addEventListener('loadedmetadata', updateGuide);
  video.addEventListener('resize', updateGuide);

  function resume() {
    if (document.hidden) return;
    startCamera();
    if (ut.url && ut.key && !ut.blocked) loadSource();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopCamera();
      clearTimeout(ut.timer);
      selectedPlate = '';
      selectedUntil = 0;
      manualUntil = 0;
      render('Đã tạm dừng', 'Quay lại trang để tiếp tục.');
    } else {
      resume();
    }
  });

  window.addEventListener('pagehide', () => {
    stopCamera();
    clearTimeout(ut.timer);
  });

  window.addEventListener('pageshow', resume);

  setInterval(() => {
    if (!document.hidden) {
      sourceStatus();
      refreshResult();
    }
  }, 1000);

  try {
    const savedUrl = localStorage.getItem(URL_STORAGE) || UT_API_URL;
    if (savedUrl) {
      ut.url = validateUrl(savedUrl);
      $('apiInput').value = ut.url;
    }
  } catch {}

  try {
    const saved = JSON.parse(
      sessionStorage.getItem(SESSION_STORAGE) || 'null'
    );

    if (saved && saved.url === ut.url && typeof saved.key === 'string') {
      ut.key = saved.key;
    }
  } catch {
    forgetSession();
  }

  resume();
})();
</script>

</html>
