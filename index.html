<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Truck Check · Scanner DEV</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080d1d;
      color: #edf3ff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 560px;
      margin: auto;
      padding: 24px 16px;
    }
    .brand {
      color: #80cfff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    h1 { font-size: 28px; margin: 12px 0; }
    p { line-height: 1.6; }
    .muted { color: #a5b6ce; }
    .viewer {
      position: relative;
      margin: 18px 0;
      background: black;
      border-radius: 16px;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
    }
    #guide {
      position: absolute;
      left: 8%;
      top: 30%;
      width: 84%;
      height: 40%;
      border: 3px solid #80cfff;
      border-radius: 8px;
      pointer-events: none;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, select, input {
      font: inherit;
      border-radius: 10px;
      padding: 13px;
    }
    button {
      border: 0;
      background: #3489c7;
      color: white;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    button:disabled { opacity: .45; cursor: default; }
    select, input {
      width: 100%;
      background: #111b30;
      border: 1px solid #344661;
      color: white;
      margin-top: 8px;
    }
    input {
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .card {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #111b30;
    }
    #status { overflow-wrap: anywhere; }
    canvas {
      width: 256px;
      max-width: 100%;
      border: 1px solid #344661;
      margin-top: 10px;
    }
    small { color: #a5b6ce; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
</head>
<body>
<main>
  <div class="brand">BD MEGA · SCANNER DEV</div>
  <h1>Quét biển số xe</h1>
  <p class="muted">Đưa toàn bộ biển số vào khung xanh rồi bấm Đọc biển số.</p>

  <label for="mode">Kiểu khung quét</label>
  <select id="mode">
    <option value="plate">Biển số</option>
    <option value="side">Chữ trên thùng xe</option>
  </select>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <div id="guide"></div>
  </div>

  <div class="buttons">
    <button id="start" type="button">Bật camera</button>
    <button id="stop" type="button" disabled>Tắt camera</button>
    <button id="read" type="button" disabled>Đọc biển số</button>
  </div>

  <p id="status" role="status">Chưa bật camera.</p>
  <p id="modelStatus" class="muted">Model chưa tải.</p>

  <div class="card">
    <label for="plate">BKS đọc được — kiểm tra và sửa nếu cần</label>
    <input id="plate" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="Chưa có kết quả">
    <p id="score" class="muted"></p>
    <small>Bước kiểm tra OCR · Chưa tra UT · Chưa lưu lượt quét.</small>
  </div>

  <details class="card">
    <summary>Ảnh thực tế đưa vào model</summary>
    <canvas id="crop" width="128" height="64"></canvas>
  </details>
</main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const video = $('video');
  const start = $('start');
  const stop = $('stop');
  const read = $('read');
  const status = $('status');
  const modelStatus = $('modelStatus');
  const canvas = $('crop');
  const context = canvas.getContext('2d', { willReadFrequently: true });

  const ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_';
  const MODEL_URL = new URL('./cct_xs_v2_global.onnx', location.href).href;
  const RUNTIME_BASE =
    'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';

  let stream = null;
  let session = null;
  let loadingModel = null;
  let opening = false;
  let reading = false;
  let generation = 0;

  function normalizePlate(value) {
    return String(value || '').toUpperCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '');
  }

  function updateButtons() {
    start.disabled = opening || !!stream;
    stop.disabled = !opening && !stream;
    read.disabled = !stream || !session || reading || opening;
  }

  function clearResult() {
    $('plate').value = '';
    $('score').textContent = '';
  }

  function stopCamera(message = 'Camera đã tắt.') {
    generation++;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    opening = false;
    video.pause();
    video.srcObject = null;
    clearResult();
    status.textContent = message;
    updateButtons();
  }

  async function loadModel() {
    if (session) return session;
    if (loadingModel) return loadingModel;

    loadingModel = (async () => {
      if (!window.ort) {
        throw new Error('Không tải được ONNX Runtime. Hãy tải lại trang.');
      }

      modelStatus.textContent = 'Đang tải model OCR…';

      ort.env.wasm.wasmPaths = RUNTIME_BASE;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      let bytes;

      try {
        const response = await fetch(MODEL_URL, {
          signal: controller.signal
        });
        if (!response.ok) {
          throw new Error('Tải model lỗi HTTP ' + response.status);
        }
        bytes = await response.arrayBuffer();
      } finally {
        clearTimeout(timeout);
      }

      modelStatus.textContent = 'Đang khởi tạo OCR…';

      session = await ort.InferenceSession.create(bytes, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all'
      });

      if (!session.outputNames.includes('plate')) {
        await session.release();
        session = null;
        throw new Error('Model không có đầu ra plate như cấu hình.');
      }

      modelStatus.textContent = 'ONNX đã sẵn sàng.';
      updateButtons();
      return session;
    })();

    try {
      return await loadingModel;
    } finally {
      loadingModel = null;
    }
  }

  async function startCamera() {
    if (opening || stream) return;

    if (!navigator.mediaDevices?.getUserMedia) {
      status.textContent =
        'Không truy cập được camera. Mở trang HTTPS bằng Safari/Chrome.';
      return;
    }

    const requestId = ++generation;
    opening = true;
    updateButtons();
    status.textContent = 'Đang xin quyền camera…';

    // Tải model độc lập; lỗi model không làm mất hình camera.
    loadModel().catch(error => {
      modelStatus.textContent =
        'Lỗi model: ' + error.message +
        ' · Tắt rồi bật camera để thử lại.';
    });

    try {
      const nextStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      if (requestId !== generation) {
        nextStream.getTracks().forEach(track => track.stop());
        return;
      }

      stream = nextStream;
      video.srcObject = stream;
      await video.play();

      if (requestId !== generation) return;

      opening = false;
      status.textContent = 'Camera đã mở. Căn biển số vào khung xanh.';
      updateButtons();

      stream.getVideoTracks()[0].addEventListener('ended', () => {
        if (requestId === generation) {
          stopCamera('Camera bị ngắt. Bấm Bật camera để tiếp tục.');
        }
      });
    } catch (error) {
      if (requestId !== generation) return;

      const messages = {
        NotAllowedError: 'Chưa được cấp quyền camera.',
        NotFoundError: 'Không tìm thấy camera.',
        NotReadableError: 'Camera không đọc được hoặc đang bị ứng dụng khác chiếm.'
      };

      stopCamera(
        (error.name || 'CAMERA_ERROR') + ': ' +
        (messages[error.name] || error.message)
      );
    }
  }

  function cropToTensor() {
    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height || video.readyState < 2) {
      throw new Error('Chưa có hình camera. Chờ một chút rồi thử lại.');
    }

    // Video hiển thị toàn ảnh, không dùng object-fit: cover.
    // Quy đổi đúng vị trí khung xanh sang pixel ảnh camera.
    const videoRect = video.getBoundingClientRect();
    const guideRect = $('guide').getBoundingClientRect();

    const x = (guideRect.left - videoRect.left) / videoRect.width * width;
    const y = (guideRect.top - videoRect.top) / videoRect.height * height;
    const w = guideRect.width / videoRect.width * width;
    const h = guideRect.height / videoRect.height * height;

    context.drawImage(video, x, y, w, h, 0, 0, 128, 64);

    const rgba = context.getImageData(0, 0, 128, 64).data;
    const rgb = new Uint8Array(128 * 64 * 3);

    for (let src = 0, dst = 0; src < rgba.length; src += 4) {
      rgb[dst++] = rgba[src];
      rgb[dst++] = rgba[src + 1];
      rgb[dst++] = rgba[src + 2];
    }

    return new ort.Tensor('uint8', rgb, [1, 64, 128, 3]);
  }

  function decode(output) {
    if (
      !output || output.dims.length !== 3 ||
      output.dims[1] !== 10 || output.dims[2] !== 37
    ) {
      throw new Error('Đầu ra OCR không đúng kích thước [1,10,37].');
    }

    let text = '';
    let total = 0;
    let count = 0;

    for (let slot = 0; slot < 10; slot++) {
      const offset = slot * 37;
      let best = 0;

      for (let j = 1; j < 37; j++) {
        if (output.data[offset + j] > output.data[offset + best]) {
          best = j;
        }
      }

      const character = ALPHABET[best];
      if (character !== '_') {
        text += character;
        total += output.data[offset + best];
        count++;
      }
    }

    // Đây là điểm model, không phải tỷ lệ chính xác đã kiểm chứng.
    return {
      plate: normalizePlate(text),
      score: count ? total / count : 0
    };
  }

  async function readPlate() {
    if (!stream || !session || reading) return;

    reading = true;
    const requestId = generation;
    clearResult();
    updateButtons();
    status.textContent = 'Đang đọc biển số…';

    let tensor;
    let outputs;

    try {
      tensor = cropToTensor();
      const began = performance.now();

      outputs = await session.run({
        [session.inputNames[0]]: tensor
      });

      if (requestId !== generation) return;

      const result = decode(outputs.plate);
      const elapsed = Math.round(performance.now() - began);

      if (!result.plate) {
        status.textContent = 'Chưa đọc được chữ. Căn gần hơn và thử lại.';
        return;
      }

      $('plate').value = result.plate;
      $('score').textContent =
        'Thời gian chạy model: ' + elapsed + ' ms' +
        ' · Điểm model: ' + result.score.toFixed(3);

      status.textContent =
        'Đã đọc ảnh. Đối chiếu BKS với xe trước khi sử dụng.';
    } catch (error) {
      if (requestId === generation) {
        status.textContent = 'OCR_ERROR: ' + error.message;
      }
    } finally {
      if (tensor) tensor.dispose();
      if (outputs) {
        Object.values(outputs).forEach(output => output.dispose());
      }
      reading = false;
      updateButtons();
    }
  }

  $('mode').addEventListener('change', () => {
    const side = $('mode').value === 'side';
    $('guide').style.top = side ? '39%' : '30%';
    $('guide').style.height = side ? '22%' : '40%';

    // Không hiển thị kết quả từ khung quét cũ.
    generation++;
    clearResult();
  });

  $('plate').addEventListener('change', event => {
    event.target.value = normalizePlate(event.target.value);
  });

  start.addEventListener('click', startCamera);
  stop.addEventListener('click', () => stopCamera());
  read.addEventListener('click', readPlate);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopCamera('Camera đã dừng khi rời trang. Bấm Bật camera để tiếp tục.');
    }
  });

  window.addEventListener('pagehide', () => stopCamera());
})();
</script>
</body>
</html>
